- id: "q:baseline:age"
  purpose: "Establish biological baseline for calculating BMR and age-related risk factors."
  label: "How old are you?"
  type: "number"
  tags: ["baseline", "energy", "sleep", "weight"]
  expectedConfidenceGain: 10
  createsFacts: ["fact:baseline:age"]
  supportsScores: ["score:energy:baseline"]
  supportsInsights: ["insight:aging:metabolism"]
  supportsDecisions: ["decision:energy:aging_impact"]
  supportsRecommendations: ["rec:protein:senior"]

- id: "q:baseline:gender"
  purpose: "Establish biological baseline for calculating BMR and hormonal contexts."
  label: "What is your biological sex?"
  type: "single-choice"
  tags: ["baseline", "energy", "weight"]
  expectedConfidenceGain: 10
  createsFacts: ["fact:baseline:gender"]
  supportsScores: ["score:energy:baseline"]
  supportsInsights: []
