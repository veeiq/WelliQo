- id: "rec:sleep:routine"
  title: "Prioritize 7 Hours of Sleep"
  description: "Set a strict bedtime to ensure you get at least 7 hours of restorative sleep."
  priority: 1
  evidenceLevel: "clinical"
  linkedDecisions: ["decision:energy:sleep_deprivation"]
  explanationTemplate: "We suggested this because you told us you are currently sleeping less than 6 hours a night, which is likely the main cause of your fatigue."
