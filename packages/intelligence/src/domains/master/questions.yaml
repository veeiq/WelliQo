# MASTER LIBRARY - Questions
# Layer 1: Identity

- id: 'q:master:greeting'
  purpose: 'Establish absolute emotional safety.'
  label: "Welcome to WelliQo. It's great to have you here. How are you feeling about starting this journey?"
  type: 'single-choice'
  tags: ['master', 'identity', 'baseline']
  expectedConfidenceGain: 10
  coachThinking: "If I start firing clinical questions immediately, they will put their walls up. I need them to know they aren't being judged."
  humanMoment: "Let's take this one step at a time."
  createsFacts: ['fact:master:emotional_state']
  supportsScores: []
  supportsInsights: []
  supportsDecisions: []
  supportsRecommendations: []
  options:
    - id: 'opt:master:greet:excited'
      label: 'Ready to go'
      value: 'excited'
    - id: 'opt:master:greet:nervous'
      label: 'A bit nervous'
      value: 'nervous'
    - id: 'opt:master:greet:overwhelmed'
      label: 'Not sure where to start'
      value: 'overwhelmed'

- id: 'q:master:goal'
  purpose: 'Discover the emotional anchor driving the desire to change.'
  label: 'What brings you here today?'
  type: 'single-choice'
  tags: ['master', 'identity', 'baseline']
  expectedConfidenceGain: 20
  coachThinking: "Nobody just wants to 'lose 10 kilos.' They want to stop feeling breathless playing with their kids. I need to find the anchor."
  humanMoment: 'Understanding why you are here is more important than any number on a scale.'
  createsFacts: ['fact:master:primary_goal']
  supportsScores: []
  supportsInsights: []
  supportsDecisions: []
  supportsRecommendations: []
  options:
    - id: 'opt:master:goal:health'
      label: 'I want to improve my overall health'
      value: 'health'
    - id: 'opt:master:goal:energy'
      label: 'I need more energy for my daily life'
      value: 'energy'
    - id: 'opt:master:goal:confidence'
      label: 'I want to feel more confident in my body'
      value: 'confidence'
    - id: 'opt:master:goal:event'
      label: "I'm preparing for a specific event or milestone"
      value: 'event'

